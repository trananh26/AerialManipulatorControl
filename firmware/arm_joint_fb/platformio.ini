; PlatformIO — ESP32 DOIT DevKit V1 arm joint ADC feedback
; Protocol matches drone_control/arm_fb_bridge.py @ 115200 baud

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L

build_flags =
	-DCORE_DEBUG_LEVEL=0
